name: regenerate oxpec profile patches

on:
  push:
    branches:
      - oxpec/profile-refactor
    paths:
      - 'kmod/scripts/regenerate-oxpec-profile-patches.py'
      - 'kmod/scripts/apply-oxpec-patches.sh'
      - 'kmod/scripts/fetch-oxpec.sh'
      - '.github/workflows/regenerate-oxpec-profile-patches.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oxpec/profile-refactor
          fetch-depth: 0

      - name: Regenerate patch series
        run: python3 kmod/scripts/regenerate-oxpec-profile-patches.py

      - name: Verify generated patches apply in sequence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/torvalds/linux/master/drivers/platform/x86/oxpec.c \
            -o kmod/oxpec/oxpec.c
          rm -f kmod/oxpec/.applied-patches
          bash kmod/scripts/apply-oxpec-patches.sh 1
          grep -q 'profile = dmi_entry->driver_data' kmod/oxpec/oxpec.c
          grep -q 'oxp_ec_profile_valid' kmod/oxpec/oxpec.c
          ! grep -q 'enum oxp_board' kmod/oxpec/oxpec.c
          ! grep -q 'oxp_ec_profiles\[' kmod/oxpec/oxpec.c
          bash kmod/scripts/apply-oxpec-patches.sh 2
          grep -q 'oxp_2_ga18' kmod/oxpec/oxpec.c
          bash kmod/scripts/apply-oxpec-patches.sh 3
          grep -q 'oxp_apex' kmod/oxpec/oxpec.c

      - name: Commit regenerated patches
        shell: bash
        run: |
          set -euo pipefail
          rm -f kmod/oxpec/oxpec.c kmod/oxpec/.applied-patches
          if git diff --quiet -- kmod/oxpec/patches/0001-platform-x86-oxpec-use-data-driven-profiles.patch \
                               kmod/oxpec/patches/0002-platform-x86-oxpec-split-onexplayer-2-profiles.patch \
                               kmod/oxpec/patches/0003-platform-x86-oxpec-add-apex-profile.patch; then
            echo 'patches already up to date'
            exit 0
          fi
          git config user.name 'Xiao Han'
          git config user.email 'hanxiao@live.com'
          git add kmod/oxpec/patches/0001-platform-x86-oxpec-use-data-driven-profiles.patch \
                  kmod/oxpec/patches/0002-platform-x86-oxpec-split-onexplayer-2-profiles.patch \
                  kmod/oxpec/patches/0003-platform-x86-oxpec-add-apex-profile.patch
          git commit -m 'oxpec: use direct validated profile pointers'
          git push origin HEAD:oxpec/profile-refactor
