name: oxpec patch series

on:
  push:
    branches:
      - oxpec/profile-refactor
    paths:
      - 'kmod/oxpec/patches/**'
      - 'kmod/oxpec/tests/**'
      - 'kmod/scripts/apply-oxpec-patches.sh'
      - 'kmod/scripts/fetch-oxpec.sh'
      - '.github/workflows/oxpec-patch-series.yml'
  pull_request:
    paths:
      - 'kmod/oxpec/patches/**'
      - 'kmod/oxpec/tests/**'
      - 'kmod/scripts/apply-oxpec-patches.sh'
      - 'kmod/scripts/fetch-oxpec.sh'
      - '.github/workflows/oxpec-patch-series.yml'

jobs:
  apply-series:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned mainline oxpec baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/torvalds/linux/master/drivers/platform/x86/oxpec.c \
            -o kmod/oxpec/oxpec.c
          actual="$(git hash-object kmod/oxpec/oxpec.c)"
          expected="34bb17fca14813669b14c8e833a87a8a85e3bd17"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "mainline oxpec.c moved: expected ${expected}, got ${actual}" >&2
            exit 1
          fi
          rm -f kmod/oxpec/.applied-patches

      - name: Apply through patch 1
        run: bash kmod/scripts/apply-oxpec-patches.sh 1

      - name: Check patch 1 structure
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'struct oxp_ec_profile' kmod/oxpec/oxpec.c
          grep -q 'profile = dmi_entry->driver_data' kmod/oxpec/oxpec.c
          grep -q 'oxp_ec_profile_valid' kmod/oxpec/oxpec.c
          ! grep -q 'enum oxp_board' kmod/oxpec/oxpec.c
          ! grep -q 'oxp_ec_profiles\[' kmod/oxpec/oxpec.c
          ! grep -q 'switch (board)' kmod/oxpec/oxpec.c
          ! grep -Eq '\.driver_data = \(void \*\)[a-z0-9_]+,' kmod/oxpec/oxpec.c
          ! grep -q 'oxp_2_ga18' kmod/oxpec/oxpec.c
          ! grep -q 'oxp_apex' kmod/oxpec/oxpec.c

      - name: Mock patch 1 behavior against pre-refactor switches
        run: python3 kmod/oxpec/tests/profile-refactor-mock.py kmod/oxpec/oxpec.c

      - name: Continue through patch 2
        run: bash kmod/scripts/apply-oxpec-patches.sh 2

      - name: Check patch 2 state
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'static const struct oxp_ec_profile oxp_2_ga18' kmod/oxpec/oxpec.c
          grep -q 'DMI_EXACT_MATCH(DMI_BOARD_NAME, "ONEXPLAYER 2 GA18")' kmod/oxpec/oxpec.c
          grep -q 'DMI_EXACT_MATCH(DMI_BOARD_NAME, "ONEXPLAYER 2 GA72-R")' kmod/oxpec/oxpec.c
          ! grep -q 'oxp_apex' kmod/oxpec/oxpec.c

      - name: Continue through patch 3
        run: bash kmod/scripts/apply-oxpec-patches.sh 3

      - name: Check patch 3 profile state
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'static const struct oxp_ec_profile oxp_apex' kmod/oxpec/oxpec.c
          grep -Eq '#define[[:space:]]+OXP_APEX_CHARGE_LIMIT_REG[[:space:]]+0xE5' kmod/oxpec/oxpec.c
          grep -Eq '#define[[:space:]]+OXP_APEX_CHARGE_INHIBIT_REG[[:space:]]+0xE6' kmod/oxpec/oxpec.c
          grep -A4 'DMI_EXACT_MATCH(DMI_BOARD_NAME, "ONEXPLAYER APEX")' kmod/oxpec/oxpec.c | grep -q '&oxp_apex'
          grep -A4 'DMI_EXACT_MATCH(DMI_BOARD_NAME, "ONEXPLAYER X2Mini PRO")' kmod/oxpec/oxpec.c | grep -q '&oxp_apex'

      - name: Continue through patch 4
        run: bash kmod/scripts/apply-oxpec-patches.sh 4

      - name: Check profile validation review fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'oxp_ec_profile_valid(const struct oxp_ec_profile \*p)' kmod/oxpec/oxpec.c
          grep -q 'p->turbo_led_off == p->turbo_led_on' kmod/oxpec/oxpec.c
          grep -q 'p->charge_inhibit_mask_awake & p->charge_inhibit_mask_off' kmod/oxpec/oxpec.c
          grep -q 'pr_err("oxpec: incomplete fan/PWM register profile' kmod/oxpec/oxpec.c
          grep -q 'pr_err("oxpec: turbo LED on/off values are identical' kmod/oxpec/oxpec.c
          grep -q 'pr_err("oxpec: invalid charge inhibit masks' kmod/oxpec/oxpec.c
          ! grep -q 'OXP_X1_CHARGE_INHIBIT_MASK_ALWAYS' kmod/oxpec/oxpec.c
          ! grep -q '!p->pwm_max' kmod/oxpec/oxpec.c
