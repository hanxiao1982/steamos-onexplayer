# OneXConsole 0.10.2-fix8 EC maps
# Addresses are 8-bit ACPI EC RAM offsets.
# OneXConsole wire format: encoded = 0x400 + offset
#
# Access:
#   1 = WinRing0 (ports 0x62/0x66)
#   2 = OxpWMI
#
# Fan RPM is 16-bit big-endian at fan_rpm / fan_rpm+1.

encoding:
  formula: "encoded = 0x400 + ec_reg"
  command_port: 0x66
  data_port: 0x62

# Shared sensor block: hardcoded initOXPSensorEc for every device
sensors: &sensors
  board_sensor1: 0x60
  board_sensor2: 0x61
  cpu_temp: 0x70
  battery_temp: 0xA0
  battery_charge_current: 0xA1   # 16-bit BE with 0xA2
  set_tdp_able: 0xED             # gate only; watts are MSR/ryzenadj

pwm_common: &pwm_common
  pwm_enable: 0x4A
  pwm_enable_auto: 0
  pwm_enable_manual: 1
  pwm_duty: 0x4B

handle_x2: &handle_x2
  handle_power: 0x2D
  handle_power_on: 1
  handle_power_off: 0
  handle_power_restore: -1

bypass_x2: &bypass_x2
  bypass_off: 0
  bypass_awake: 1
  bypass_always: 3
  power_supply_mode: 0xE3

families:
  intel_x2_class:
    description: >
      X2 Mini, X2, X2 EVA, OneXPlayer 3, Apex i, Apex Air.
      Same layout as Linux oxpec oxp_2 / oxp_x1 for fan and turbo.
    access: oxpwmi
    ec_access_type: 2
    fan_rpm: 0x58
    app_fun_en: 0xEB
    pwm_max: 184
    charge_limit: 0xA3
    charge_bypass: 0xA4
    force_charge_min: 0xA5
    <<: [*pwm_common, *handle_x2, *bypass_x2, *sensors]

  amd_fly_class_minipro:
    description: >
      X2 Mini PRO (and APEX). Fan/turbo match oxpec oxp_fly.
      Charge registers are 0xE5-0xE7 in OneXConsole, not oxpec's 0xA3/0xA4.
    access: winring0
    ec_access_type: 1
    fan_rpm: 0x76
    app_fun_en: 0xF1
    pwm_max: 255
    charge_limit: 0xE5
    charge_bypass: 0xE6
    force_charge_min: 0xE7
    <<: [*pwm_common, *handle_x2, *bypass_x2, *sensors]

models:
  - id: x2-mini
    product: ONEXPLAYER X2Mini
    marketing: X2 Mini
    cpu: Intel
    family: intel_x2_class
    tdp:
      max: 45
      boost: 46
      default: 25
      via: intel-msr

  - id: x2-mini-pro
    product: ONEXPLAYER X2Mini PRO
    marketing: X2 Mini PRO
    cpu: AMD
    family: amd_fly_class_minipro
    tdp:
      max: 55
      boost: 70
      default: 45
      dcin_max: 80
      cooling_dock: 120
      via: ryzenadj
    notes:
      - BIOS version containing "onec1" enables cooling-system 120W path
      - DMI board name reported by kernel patch: "ONEXPLAYER X2Mini PRO"

  - id: x2
    product: ONEXPLAYER X2
    marketing: X2 (10.95" 3-in-1)
    cpu: Intel
    family: intel_x2_class
    aliases: [ONEXPLAYER X2 EVA]
    tdp:
      max: 35
      boost: 36
      unlock: 40
      default: 25
      via: intel-msr

  - id: apex-air
    product: ONEXPLAYER Apex Air
    marketing: Apex Air
    cpu: Intel
    family: intel_x2_class
    aliases: [ONEXPLAYER Apex i]
    tdp:
      default: 25
      plugin: 35
      boost_low_sku: 46
      boost_high_sku: 66
      via: intel-msr
    notes:
      - Same detect branch as Apex i; EC offsets identical
      - Charge regs are 0xA3-0xA5, not AMD APEX 0xE5-0xE7

  - id: onexplayer-3
    product: ONEXPLAYER 3
    marketing: OneXPlayer 3
    cpu: Intel
    family: intel_x2_class
    tdp:
      max: 35
      boost: 36
      unlock: 40
      default: 25
      via: intel-msr
    notes:
      - Handle image key OXP3; RGB partition mode
      - No EVA/Pro/i product string in 0.10.2-fix8

not_found:
  - X2 Air
  - X2Air
  - ONEXPLAYER X2 Air
  - ONEXPLAYER X2Air
