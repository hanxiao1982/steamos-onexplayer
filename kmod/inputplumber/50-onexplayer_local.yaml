# Copy to the handheld after editing matches.dmi_data from local-device.env.
# CachyOS: /usr/share/inputplumber/devices/50-onexplayer_local.yaml
# Bazzite: same path after `ostree admin unlock --hotfix`, or
#          /etc/inputplumber/devices/ if that directory is read by your version.
version: 1
kind: CompositeDevice
name: ONEXPLAYER LOCAL
single_source: false

matches:
  - dmi_data:
      product_name: ONEXPLAYER NEWMODEL
      sys_vendor: ONE-NETBOOK

source_devices:
  - group: gamepad
    evdev:
      name: Microsoft X-Box 360 pad
      handler: event*

  - group: keyboard
    evdev:
      name: "HID 1a86:fe00"
      handler: event*

  - group: keyboard
    evdev:
      name: AT Translated Set 2 keyboard
      handler: event*

  - group: gamepad
    hidraw:
      vendor_id: 0x1a86
      product_id: 0xfe00
      interface_num: 2

  - group: imu
    iio:
      name: "{i2c-BMI0160:00,bmi260}"

options:
  auto_manage: true

target_devices:
  - xbox-elite
  - mouse
  - keyboard

# oxp8 = APEX-style map (swapped paddles). Try oxp5 if this is closer to X1.
capability_map_id: oxp8
